name: pulumi-api-backend
x-api: &api
  image: pulumi-api-backend:local
  build: .
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    BACKEND_DATABASE_URL: postgres://backend:${DB_PASSWORD}@db:5432/backend?sslmode=disable
    BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    BACKEND_CONSOLE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    BACKEND_MASTER_KEY_FILE: /run/secrets/master.key
    BACKEND_DEV_HTTP: "true"
    BACKEND_ENABLE_JOURNAL: ${BACKEND_ENABLE_JOURNAL:-false}
  volumes:
    - ./.dev/master.key:/run/secrets/master.key:ro
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run make dev-init}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U backend -d backend"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    <<: *api
    ports:
      - 127.0.0.1:8080:8080
  worker:
    <<: *api
    command: [worker]
volumes:
  database:
